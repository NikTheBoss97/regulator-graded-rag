# Author: Nicola Antonello
#
# The checks every pull request and every push to main must pass (ADR-0013, ADR-0015).
# The checks job runs the same command a developer runs. The tests job runs the
# integration tests against the same Postgres image as compose.yaml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -m tools.gates
        env:
          TRAILER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2 # 0.8.7-pg18-trixie
        env:
          # A throwaway database that lives only as long as this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Health over TCP, for the reason compose.yaml gives.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run pytest tests/integration -q
