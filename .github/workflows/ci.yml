# Author: Nicola Antonello
#
# The checks every pull request and every push to main must pass (ADR-0013, ADR-0015).
# The checks job runs the same command a developer runs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run python -m tools.gates
        env:
          TRAILER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
