# Author: Nicola Antonello
[project]
name = "regulator-graded-rag"
version = "0.1.0"
description = "Answers hazmat-regulation questions with quotes that code verifies, graded against the regulator's own answers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "psycopg[binary]==3.3.6",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "zizmor==1.31.1",
]

[tool.uv]
required-version = ">=0.12.17"

[tool.ruff]
target-version = "py314"

[tool.mypy]
strict = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
